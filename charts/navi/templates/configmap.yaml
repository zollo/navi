apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "navi.fullname" . }}-config
  labels:
    {{- include "navi.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  POSTGRES_HOST: {{ include "navi.postgresHost" . | quote }}
  POSTGRES_PORT: {{ include "navi.postgresPort" . | quote }}
  POSTGRES_USER: {{ include "navi.postgresUser" . | quote }}
  POSTGRES_DB: {{ include "navi.postgresDatabase" . | quote }}
  {{- with .Values.customDomains }}
  CUSTOM_DOMAINS_ENABLED: {{ .enabled | toString | quote }}
  CUSTOM_DOMAIN_TARGET: {{ .target | quote }}
  CUSTOM_DOMAIN_IPS: {{ join "," .ips | quote }}
  CUSTOM_DOMAIN_BLOCKED: {{ join "," .blocked | quote }}
  CUSTOM_DOMAIN_RESOLVERS: {{ join "," .resolvers | quote }}
  {{- end }}
