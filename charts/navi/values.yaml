# Default values for the Navi chart.

nameOverride: ""
fullnameOverride: ""

image:
  # -- Backend image: serves the REST API and runs migrations.
  backend: ghcr.io/zollo/navi-backend
  # -- Frontend image: the React SPA served by nginx.
  frontend: ghcr.io/zollo/navi-frontend
  # -- Tag for both images. Defaults to the chart appVersion (the release a
  # published chart was cut from), or "latest" from a source checkout.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Non-secret settings, rendered into a ConfigMap as environment variables
# (see .env.example). POSTGRES_HOST/PORT/DB/USER are set by the chart from the
# postgresql section below.
config:
  NAVI_ENV: production
  # Comma-separated browser origins; set to the public URL(s), e.g. https://navi.example.com
  CORS_ORIGINS: ""
  # Public URL; pages live at NAVI_PUBLIC_URL/<handle>.
  NAVI_PUBLIC_URL: ""
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  JWT_ALGORITHM: HS256
  ALLOW_REGISTRATION: "true"
  # Comma-separated emails that become admins on sign-in (admins curate the
  # background gallery). Or: kubectl exec ... -- python -m app.manage admin <email>
  ADMIN_EMAILS: ""
  LINKTREE_IMPORT_ENABLED: "true"
  MAX_AVATAR_KB: "1024"
  MAX_BACKGROUND_KB: "2048"

# -- Name of an existing Secret with the sensitive settings. Keys: SECRET_KEY,
# POSTGRES_PASSWORD. When empty the chart creates a Secret from `secrets` below.
existingSecret: ""

# -- Sensitive settings, used only when existingSecret is empty. Prefer an
# existingSecret created out-of-band so secrets never sit in a values file.
secrets: {}
#  SECRET_KEY: "<openssl rand -hex 32>"
#  POSTGRES_PASSWORD: "<openssl rand -hex 16>"

backend:
  replicaCount: 2
  # -- Run `alembic upgrade head` in an init container before the API starts
  # (retries while the database comes up).
  migrate: true
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  readinessProbe:
    httpGet:
      path: /api/health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

frontend:
  replicaCount: 2
  podAnnotations: {}
  # nginx starts as root and drops to the nginx user, so no runAsNonRoot here.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 15
  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

service:
  backendPort: 8000
  frontendPort: 80

ingress:
  enabled: false
  className: ""
  # ingress-nginx caps request bodies at 1m by default; background uploads can be
  # up to MAX_BACKGROUND_KB, e.g. nginx.ingress.kubernetes.io/proxy-body-size: 5m
  annotations: {}
  # -- Hostnames. Each gets /api, /mcp, /docs, /redoc, /openapi.json -> backend and
  # everything else -> frontend. /mcp is the MCP server for AI assistants; clients
  # that only take a URL send their API key as ?key=, so consider keeping query
  # strings out of the ingress controller's access log.
  hosts:
    - navi.example.com
  tls: []
  #  - secretName: navi-tls
  #    hosts: [navi.example.com]

# Custom domains: users show their page on their own domain (www.example.com).
# Users add a TXT record (ownership) and a CNAME/A record pointing at this
# cluster; a CronJob verifies DNS and creates one Ingress per verified domain.
# TLS: the Ingress annotations below should request a certificate per domain,
# e.g. a cert-manager ClusterIssuer with an HTTP-01 solver (DNS-01 can't work
# for domains you don't control), so port 80 must reach the ingress controller.
customDomains:
  enabled: false
  # -- Hostname users point a CNAME at. Default: NAVI_PUBLIC_URL's host.
  target: ""
  # -- Public IPv4 address(es) for apex domains (example.com can't have a
  # CNAME). Optional; without it, apex users are told to use the CNAME too.
  ips: []
  # -- Domains (and their subdomains) nobody may claim, e.g. your own zone.
  # NAVI_PUBLIC_URL's host and the target are always blocked.
  blocked: []
  # -- DNS servers used for verification (public ones, so split-horizon DNS
  # inside the cluster doesn't skew the answer).
  resolvers: [1.1.1.1, 8.8.8.8]
  sync:
    # -- How often pending domains are checked and Ingresses reconciled.
    schedule: "*/2 * * * *"
    # -- Create/delete one Ingress per verified domain (Role on ingresses in
    # this namespace). false = only check DNS; route the domains yourself.
    ingresses: true
    # -- CIDRs of the Kubernetes API server endpoints (e.g. the control-plane
    # node IPs). When set, a NetworkPolicy lets the sync job reach them on
    # apiServerPort, for namespaces whose policies deny egress by default.
    apiServerCIDRs: []
    apiServerPort: 6443
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 256Mi
  ingress:
    className: ""
    # -- Annotations for each custom-domain Ingress, e.g.
    # cert-manager.io/cluster-issuer: letsencrypt-http01
    annotations: {}
    # -- Extra labels for each custom-domain Ingress (they always carry
    # navi.zollo.net/custom-domain: "true", for admission policies).
    labels: {}
    # -- Give each Ingress a tls section (secret <ingress-name>-tls).
    tls: true

# Bundled PostgreSQL (single instance, StatefulSet + PVC). It holds all durable
# data: users, pages, links and avatars.
postgresql:
  enabled: true
  image: postgres:16-alpine
  user: navi
  database: navi
  persistence:
    # -- StorageClass for the data PVC ("" = cluster default).
    storageClass: ""
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Nightly pg_dump (custom format) to a separate volume, e.g. an NFS-backed
  # StorageClass, so a lost node or PVC doesn't lose the data.
  backup:
    enabled: false
    schedule: "15 3 * * *"
    # -- Number of dumps to keep.
    keep: 14
    persistence:
      # -- Use an existing PVC for the dumps instead of creating one.
      existingClaim: ""
      storageClass: ""
      accessModes: [ReadWriteOnce]
      size: 5Gi
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 256Mi

# Used when postgresql.enabled is false. The password is still read from the
# Secret (POSTGRES_PASSWORD).
externalDatabase:
  host: ""
  port: 5432
  user: navi
  database: navi

