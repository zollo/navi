# ─────────────────────────────────────────────────────────────────────────
# Navi — TrueNAS SCALE (Electric Eel 24.10+) deployment
#
# Optimized for TrueNAS:
#   * Uses prebuilt images from GHCR (TrueNAS does not build images).
#   * Only the frontend port is published; everything else is internal.
#   * The frontend reverse-proxies /api to the backend, so you reach the whole
#     app (public pages, editor, REST API) on ONE port with no CORS.
#   * Postgres (the source of truth, including avatars) lives on a host
#     dataset for snapshots/backups.
#
# Recommended install path: TrueNAS Apps → "Custom App" → Install via YAML,
# or a compose manager like Dockge. Provide the variables via a .env file
# (see .env.example) or by editing the values below.
# ─────────────────────────────────────────────────────────────────────────
name: navi

services:
  postgres:
    image: postgres:16-alpine
    container_name: navi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-navi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navi}
      POSTGRES_DB: ${POSTGRES_DB:-navi}
      # Keep data in a subdir so the mounted dataset root can hold other files.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Host dataset — snapshot/backup this path. Change 'tank' to your pool.
      - ${NAVI_DATA:-/mnt/tank/apps/navi}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-navi}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/zollo/navi-backend:${NAVI_TAG:-latest}
    container_name: navi-backend
    restart: unless-stopped
    # Every value below is a plain environment variable you can override from any
    # source: a .env file (Dockge / `docker compose`), the shell, or the TrueNAS
    # Custom App "Environment Variables" section. SECRET_KEY is required
    # (see .env.example / README).
    environment:
      NAVI_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY, e.g. openssl rand -hex 32}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-navi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navi}
      POSTGRES_DB: ${POSTGRES_DB:-navi}
      CORS_ORIGINS: ${NAVI_PUBLIC_URL:-http://localhost:30083}
      NAVI_PUBLIC_URL: ${NAVI_PUBLIC_URL:-http://localhost:30083}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LINKTREE_IMPORT_ENABLED: ${LINKTREE_IMPORT_ENABLED:-true}
      MAX_AVATAR_KB: ${MAX_AVATAR_KB:-1024}
      MAX_BACKGROUND_KB: ${MAX_BACKGROUND_KB:-2048}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/zollo/navi-frontend:${NAVI_TAG:-latest}
    container_name: navi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # The only published port. Open http://<truenas-ip>:${NAVI_PORT}.
      - "${NAVI_PORT:-30083}:80"
    # Explicit healthcheck with a start_period so TrueNAS marks it healthy
    # promptly and the app leaves the "Deploying" state.
    # Use 127.0.0.1 (not "localhost"): busybox wget may resolve localhost to
    # ::1 first, but nginx listens on IPv4 only, so the check would fail.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
